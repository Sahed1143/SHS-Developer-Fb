<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP FB Proxy App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        .container { 
            width: 100%; 
            max-width: 360px; 
            background: #090909; 
            border: 1px solid #1a1a1a; 
            border-radius: 20px; 
            padding: 30px 20px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.95); 
        }
        h2 { font-size: 20px; margin-bottom: 25px; color: #ffffff; font-weight: 600; }
        
        /* Input & Button Styles */
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            border: 1px solid #222222; 
            border-radius: 10px; 
            background: #121212; 
            color: #ffffff; 
            font-size: 16px; 
            text-align: center; 
            outline: none; 
        }
        input:focus { border-color: #1877f2; }
        
        .btn-action { 
            width: 100%; 
            padding: 14px; 
            margin: 6px 0; 
            border: 1px solid #222222; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #141414;
            color: #ffffff;
            transition: 0.2s; 
        }
        .btn-action:active { background: #222222; }
        .btn-login { background: #1877f2; color: #ffffff; border: none; }
        .btn-tg { background: #0088cc; color: #ffffff; border: none; }

        /* Circular Circle VPN Button */
        .circle-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
        }
        .circle-btn {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #121212;
            border: 3px solid #222222;
            color: #888888;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .circle-btn .icon { font-size: 28px; margin-bottom: 5px; }
        .circle-btn.connecting { border-color: #ffcc00; color: #ffcc00; }
        .circle-btn.connected { border-color: #00ffcc; color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        .circle-btn.error { border-color: #ff4d4d; color: #ff4d4d; }

        /* Status Box */
        .status-box { 
            margin-top: 20px; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            background: #111111; 
            border: 1px solid #222222; 
        }
        .text-success { color: #00ffcc; }
        .text-error { color: #ff4d4d; }
        .text-warning { color: #ffcc00; }

        /* Hidden Sections */
        #vpnSection { display: none; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- STEP 1: Login Screen -->
        <div id="loginSection">
            <h2>🔑 Access Code Verification</h2>
            <input type="text" id="accessCode" placeholder="Enter Access Code...">
            <button class="btn-action btn-login" onclick="verifyAccess()">Login System</button>
            <button class="btn-action btn-tg" onclick="openTelegram()">Buy Access Code</button>
            <div id="loginStatus" class="status-box text-warning">এক্সেস কোড দিয়ে লগইন করুন</div>
        </div>

        <!-- STEP 2: Circular Proxy/VPN Connect Screen -->
        <div id="vpnSection">
            <h2>🌐 VIP Proxy System</h2>
            
            <div class="circle-btn-container">
                <button id="circleBtn" class="circle-btn" onclick="connectProxy()">
                    <span id="circleIcon" class="icon">🔴</span>
                    <span id="circleText">CONNECT</span>
                </button>
            </div>

            <div id="vpnStatus" class="status-box text-warning">প্রক্সি সেকশনে ক্লিক করুন</div>
        </div>

    </div>

    <script>
        const DB_URL = "https://shs-developer-fb-default-rtdb.firebaseio.com/";
        const TELEGRAM_USER = "saku_143"; // 👉 টেলিগ্রাম ইউজারনেম

        // ডিভাইস লক আইডেন্টিফায়ার
        function getDeviceId() {
            let id = localStorage.getItem("app_device_uuid");
            if (!id) {
                id = "DEV-" + Math.random().toString(36).substring(2, 9) + "-" + Date.now();
                localStorage.setItem("app_device_uuid", id);
            }
            return id;
        }

        function openTelegram() {
            window.location.href = "https://t.me/" + TELEGRAM_USER;
        }

        // ১. এক্সেস কোড ভেরিফিকেশন
        async function verifyAccess() {
            const code = document.getElementById("accessCode").value.trim();
            const status = document.getElementById("loginStatus");
            if (!code) return status.innerText = "এক্সেস কোড লিখুন!";

            status.innerText = "কোড ভেরিফাই হচ্ছে...";

            try {
                let res = await fetch(DB_URL + "codes/" + code + ".json");
                let data = await res.json();

                if (!data) {
                    status.className = "status-box text-error";
                    return status.innerText = "❌ ভুল কোড! টেলিগ্রামে যোগাযোগ করুন।";
                }
                if (data.status !== "active") {
                    status.className = "status-box text-error";
                    return status.innerText = "🚫 এই কোডটি ডিজেবল করা হয়েছে!";
                }

                let myDevId = getDeviceId();

                if (!data.device_id) {
                    await fetch(DB_URL + "codes/" + code + ".json", {
                        method: "PATCH",
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ device_id: myDevId })
                    });
                    showVpnScreen();
                } else if (data.device_id === myDevId) {
                    showVpnScreen();
                } else {
                    status.className = "status-box text-error";
                    status.innerText = "⛔ Access Denied! এই কোডটি অন্য ফোনে ব্যবহৃত।";
                }

            } catch (e) {
                status.className = "status-box text-error";
                status.innerText = "⚠️ নেটওয়ার্ক সমস্যা! সংযোগ চেক করুন।";
            }
        }

        function showVpnScreen() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("vpnSection").style.display = "block";
        }

        // ২. গোল বাটন ক্লিক লজিক ও অরিজিনাল প্রক্সি চেক
        async function connectProxy() {
            const circleBtn = document.getElementById("circleBtn");
            const circleIcon = document.getElementById("circleIcon");
            const circleText = document.getElementById("circleText");
            const vpnStatus = document.getElementById("vpnStatus");

            // স্টেট পরিবর্তন (Connecting)
            circleBtn.className = "circle-btn connecting";
            circleIcon.innerText = "🟡";
            circleText.innerText = "CHECKING";
            vpnStatus.className = "status-box text-warning";
            vpnStatus.innerText = "প্রক্সি চেক করা হচ্ছে...";

            try {
                // ফায়ারবেস থেকে প্রক্সি ডাটা টেস্ট
                let res = await fetch(DB_URL + "proxy_config.json");
                let proxyData = await res.json();

                if (proxyData && proxyData.ip && proxyData.port) {
                    // প্রক্সি সঠিকভাবে অ্যাড করা আছে
                    circleBtn.className = "circle-btn connected";
                    circleIcon.innerText = "🟢";
                    circleText.innerText = "CONNECTED";
                    
                    vpnStatus.className = "status-box text-success";
                    vpnStatus.innerText = "SUCCESS: Proxy Connected! Opening Facebook...";

                    // ১ সেকেন্ড পর স্বয়ংক্রিয়ভাবে সরাসরি ফেসবুকে নিয়ে যাবে
                    setTimeout(() => {
                        window.location.href = "https://m.facebook.com";
                    }, 1200);

                } else {
                    throw new Error("No Proxy");
                }

            } catch (e) {
                // এডমিন প্যানেলে প্রক্সি অ্যাড করা নেই বা ভুল
                circleBtn.className = "circle-btn error";
                circleIcon.innerText = "🔴";
                circleText.innerText = "ERROR";
                
                vpnStatus.className = "status-box text-error";
                vpnStatus.innerText = "ERROR: এডমিন প্যানেলে সঠিক প্রক্সি যুক্ত করা নেই!";
            }
        }
    </script>
</body>
</html>
